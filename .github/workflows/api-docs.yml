name: API docs (Infomaniak)

# Outil ponctuel : télécharge la documentation publique de l'API eTickets
# et en affiche un résumé (authentification, endpoints) dans le journal.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page de documentation"
        required: true
        default: https://etickets.infomaniak.com/docs/app/index.html

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pyyaml
      - run: python tools/summarize_api_docs.py "${{ inputs.url }}"
