[project]
name = "cmon-ticketing-sync"
version = "0.1.0"
description = "Synchronisation billetterie (Infomaniak) -> Brevo pour les clubs C'mon Sports"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
